services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pipewatch
      POSTGRES_USER: pipewatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pipewatch-local}
    ports:
      - "5432:5432"
    volumes:
      - pipewatch-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipewatch -d pipewatch"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://pipewatch:${POSTGRES_PASSWORD:-pipewatch-local}@db:5432/pipewatch
      FRONTEND_URL: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pipewatch-postgres:
